<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Physics Insight — Your gateway to mastering NEB Grade 11 & 12 Physics. Chapter-wise content, daily quizzes, mock entrance exams for IOE & IOM, all in English and Nepali.">
    <meta name="keywords" content="NEB Physics, Grade 11 Physics, Grade 12 Physics, Nepal Physics, IOE Entrance, IOM Entrance, Physics Quiz, Mock Test, Physics Insight">
    <meta name="author" content="Physics Insight">
    <meta name="theme-color" content="#0a0a1a">
    <meta property="og:title" content="Physics Insight — NEB Grade 11 & 12 Physics">
    <meta property="og:description" content="Master NEB Physics with chapter-wise content, daily quizzes, and mock entrance exams for engineering & medical.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.facebook.com/PhysicsInsight0/">
    <title>Physics Insight — NEB Grade 11 & 12 Physics</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <!-- Navbar (injected by components.js) -->
    <nav id="navbar" class="navbar" role="navigation" aria-label="Main navigation"></nav>

    <!-- Mobile Nav Overlay -->
    <div id="mobile-overlay" class="mobile-overlay"></div>

    <!-- Main Application Container -->
    <main id="app" class="app-container" role="main">
        <!-- Page content rendered here by router -->
        <div class="loader-container" id="initial-loader">
            <div class="atom-loader">
                <div class="atom-nucleus"></div>
                <div class="atom-orbit atom-orbit-1"><div class="atom-electron"></div></div>
                <div class="atom-orbit atom-orbit-2"><div class="atom-electron"></div></div>
                <div class="atom-orbit atom-orbit-3"><div class="atom-electron"></div></div>
            </div>
            <p class="loader-text">Loading Physics Insight...</p>
        </div>
    </main>

    <!-- Footer (injected by components.js) -->
    <footer id="footer" class="footer" role="contentinfo"></footer>

    <!-- Scroll to Top Button -->
    <button id="scroll-top-btn" class="scroll-top-btn" aria-label="Scroll to top" title="Scroll to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <!-- Scripts -->
    <script src="js/i18n.js"></script>
    <script src="js/components.js"></script>
    <script src="js/quiz-engine.js"></script>
    <script src="js/feedback.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
